# Replace zikrillah.example.com with your real dedicated hostname.
# Used for HTTP ACME validation before enabling HTTPS.
server {
    listen 80;
    server_name zikrillah.example.com;
    access_log /var/log/nginx/zikrillah-access.log;
    error_log /var/log/nginx/zikrillah-error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zikrillah-acme;
    }
    location / { return 301 https://$host$request_uri; }
}
